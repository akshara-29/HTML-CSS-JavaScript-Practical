<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create a countdown timer. · Akshara</title><link rel="stylesheet" href="../assets/style.css"></head><body><header class="top"><div class="wrap nav"><a class="brand" href="../index.html">Akshara <span>Practical Lab</span></a><nav class="links"><a href="../index.html">Home</a><a href="../javascript/index.html">JavaScript Programs</a></nav></div></header><main class="wrap program"><div class="eyebrow">JavaScript Experiment 233</div><h1>Create a countdown timer.</h1><p class="muted">Working demonstration for the exact assignment item.</p><div class="box demo"><h2>Live Demonstration</h2><input id="n" class="input" type="number" value="10" min="1"><button class="btn primary" onclick="go()">Start</button><div id="o" class="big">10</div><script>let id;function go(){clearInterval(id);let x=+n.value;o.textContent=x;id=setInterval(()=>{o.textContent=--x;if(x<=0)clearInterval(id)},1000)}</script></div></main><footer class="footer"><div class="wrap">Web Technology & Internet Programming · Student: <strong>Akshara</strong></div></footer></body></html>
