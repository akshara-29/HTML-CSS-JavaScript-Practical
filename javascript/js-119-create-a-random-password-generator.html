<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create a random password generator. · Akshara</title><link rel="stylesheet" href="../assets/style.css"></head><body><header class="top"><div class="wrap nav"><a class="brand" href="../index.html">Akshara <span>Practical Lab</span></a><nav class="links"><a href="../index.html">Home</a><a href="../javascript/index.html">JavaScript Programs</a></nav></div></header><main class="wrap program"><div class="eyebrow">JavaScript Experiment 119</div><h1>Create a random password generator.</h1><p class="muted">Working demonstration for the exact assignment item.</p><div class="box demo"><h2>Live Demonstration</h2><input id="n" class="input" type="number" value="12" min="4"><button class="btn primary" onclick="gen()">Generate</button><div id="o" class="result"></div><script>function gen(){let c="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%",r="";for(let i=0;i<n.value;i++)r+=c[Math.floor(Math.random()*c.length)];o.textContent=r}</script></div></main><footer class="footer"><div class="wrap">Web Technology & Internet Programming · Student: <strong>Akshara</strong></div></footer></body></html>
