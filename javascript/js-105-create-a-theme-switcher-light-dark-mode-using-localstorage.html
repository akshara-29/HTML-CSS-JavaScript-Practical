<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create a theme switcher (light/dark mode) using localStorage. · Akshara</title><link rel="stylesheet" href="../assets/style.css"></head><body><header class="top"><div class="wrap nav"><a class="brand" href="../index.html">Akshara <span>Practical Lab</span></a><nav class="links"><a href="../index.html">Home</a><a href="../javascript/index.html">JavaScript Programs</a></nav></div></header><main class="wrap program"><div class="eyebrow">JavaScript Experiment 105</div><h1>Create a theme switcher (light/dark mode) using localStorage.</h1><p class="muted">Working demonstration for the exact assignment item.</p><div class="box demo"><h2>Live Demonstration</h2><input id="k" class="input" placeholder="Key"><input id="v" class="input" placeholder="Value"><button class="btn primary" onclick="localStorage.setItem(k.value,v.value);o.textContent=`Saved: ${k.value}`">Save</button><button class="btn" onclick="o.textContent=localStorage.getItem(k.value)||'No value'">Read</button><div id="o" class="result"></div></div></main><footer class="footer"><div class="wrap">Web Technology & Internet Programming · Student: <strong>Akshara</strong></div></footer></body></html>
