<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Write a program to find the factorial of a number. · Akshara</title><link rel="stylesheet" href="../assets/style.css"></head><body><header class="top"><div class="wrap nav"><a class="brand" href="../index.html">Akshara <span>Practical Lab</span></a><nav class="links"><a href="../index.html">Home</a><a href="../javascript/index.html">JavaScript Programs</a></nav></div></header><main class="wrap program"><div class="eyebrow">JavaScript Experiment 6</div><h1>Write a program to find the factorial of a number.</h1><p class="muted">Working demonstration for the exact assignment item.</p><div class="box demo"><h2>Live Demonstration</h2><input id="n" class="input" type="number" value="5"><button class="btn primary" onclick="run()">Calculate</button><div id="o" class="result"></div><script>function run(){let n=+document.getElementById("n").value,r=1;for(let i=2;i<=n;i++)r*=i;o.textContent=n+"! = "+r}</script></div></main><footer class="footer"><div class="wrap">Web Technology & Internet Programming · Student: <strong>Akshara</strong></div></footer></body></html>
